<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#101510" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Oly Tracker" />
    <title>Oly Tracker · Revision 6</title>
    <link rel="manifest" href="manifest.json" />
    <link rel="icon" href="icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="icon.svg" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main id="app" tabindex="-1" aria-label="Training program"></main>
    <aside id="rest-bar" hidden aria-label="Rest timer">
      <div><span class="eyebrow">REST</span><strong id="rest-count" role="timer">0:00</strong></div>
      <button class="button" onclick="adjustRest(30)">+30 s</button
      ><button class="text-button" onclick="skipRest()">Done</button>
    </aside>
    <nav aria-label="Main navigation" id="bottom-nav">
      <button data-view="home" class="active"><span aria-hidden="true">▦</span>Week</button>
      <button data-view="workout"><span aria-hidden="true">◉</span>Workout</button>
      <button data-view="history"><span aria-hidden="true">▥</span>History</button>
      <button data-view="guide"><span aria-hidden="true">≡</span>Guide</button>
      <button data-view="settings"><span aria-hidden="true">⚙</span>Settings</button>
    </nav>
    <dialog id="modal" aria-labelledby="modal-title"></dialog>
    <div id="toast" role="status" hidden></div>
    <noscript>This tracker needs JavaScript to show your schedule and save workouts.</noscript>
    <script src="js/program.js"></script>
    <script src="js/model.js"></script>
    <script src="js/app.js"></script>
    <script src="js/sync.js"></script>
    <script src="https://accounts.google.com/gsi/client" async defer></script>
  </body>
</html>
