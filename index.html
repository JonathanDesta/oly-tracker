<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#173a36" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Oly Tracker" />
    <title>Oly Tracker · Weightlifting first</title>
    <link rel="manifest" href="manifest.json" />
    <link rel="icon" href="icon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <a class="skip-link" href="#main">Skip to training</a>
    <aside id="app-update" role="status" hidden>
      <span
        >A saved app update is ready. Reload after saving any form
        changes.</span
      >
      <button id="apply-update" class="button">Load updated app</button>
    </aside>
    <div class="app-shell">
      <aside class="sidebar">
        <a class="brand" href="#week"
          ><span class="brand-mark">O/</span
          ><span>OLY TRACKER<small>Weightlifting first.</small></span></a
        >
        <nav aria-label="Main navigation">
          <button data-nav="week"><span aria-hidden="true">◫</span>Week</button
          ><button data-nav="workout">
            <span aria-hidden="true">◉</span>Workout</button
          ><button data-nav="history">
            <span aria-hidden="true">↗</span>History</button
          ><button data-nav="guide">
            <span aria-hidden="true">≡</span>Program</button
          ><button data-nav="settings">
            <span aria-hidden="true">⚙</span>Settings
          </button>
        </nav>
        <div class="sidebar-footer">
          <span class="status-dot"></span> Saved on this device<br /><small
            >REVISION 6 / 13 SEP 2026</small
          >
          <small id="app-build"></small>
          <button id="check-update" class="quiet">Check for app updates</button>
        </div>
      </aside>
      <main id="main" tabindex="-1">
        <p class="loading">Opening your training journal…</p>
      </main>
    </div>
    <aside id="timer" aria-label="Rest timer" hidden>
      <div>
        <small>REST · TAKE LONGER IF NEEDED</small
        ><strong id="timer-count" role="timer">0:00</strong>
      </div>
      <button data-action="rest-add">+30 s</button
      ><button data-action="rest-end">Done</button>
    </aside>
    <dialog id="dialog" aria-labelledby="dialog-title"></dialog>
    <div id="toast" role="status" hidden></div>
    <noscript
      ><p>
        This offline training journal needs JavaScript.
        <a href="program/revision-6.pdf">Open the full program PDF.</a>
      </p></noscript
    >
    <script type="module" src="src/app.js"></script>
  </body>
</html>
